[package]
name = "claw-desktop"
version = "1.0.0"
description = "Claw Command Deck — Secure Desktop Wrapper"
authors = ["Philip S. Wright"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
