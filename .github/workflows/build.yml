name: Build Claw Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build (Apple Silicon)
        run: cargo tauri build --target aarch64-apple-darwin
        working-directory: .

      - name: Build (Intel)
        run: cargo tauri build --target x86_64-apple-darwin
        working-directory: .

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg artifacts/Claw-Command-Deck-arm64.dmg || true
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg artifacts/Claw-Command-Deck-x64.dmg || true
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz artifacts/Claw-Command-Deck-arm64.app.tar.gz || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claw-desktop-macos
          path: artifacts/*
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
